services:
  # -------------------- DATABASE --------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: sovereign-db
    ports:
      - "127.0.0.1:5432:5432"   # loopback เท่านั้น — DB ไม่ควรเห็นจาก LAN (audit 20 ก.ย. 2569)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ../scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovereign}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # -------------------- MQTT BROKER --------------------
  emqx:
    image: emqx/emqx:latest
    container_name: sovereign-emqx
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:?EMQX_PASSWORD is required (see .env.example)}
    ports:
      - "127.0.0.1:1883:1883"    # loopback เท่านั้น — MQTT broker ใช้ภายในเครื่อง
      - "127.0.0.1:18083:18083"  # loopback เท่านั้น — dashboard จัดการ EMQX ใช้จากเครื่องนี้
    volumes:
      - ./data/emqx:/opt/emqx/data
      - ./data/emqx-logs:/opt/emqx/log
    networks:
      - internal

  # -------------------- CORE BACKEND --------------------
  core-api:
    build:
      context: ../core-api
      dockerfile: Dockerfile
    container_name: sovereign-core-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/${POSTGRES_DB:-sovereign}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${POSTGRES_DB:-sovereign}
      TIMESCALE_USER: ${POSTGRES_USER:-sovereign}
      TIMESCALE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 16 random chars)}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      TELEMETRY_FLUSH_MS: ${TELEMETRY_FLUSH_MS:-60000}
      # ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ runtime settings (ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â«ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â³ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â«ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ infra/.env) ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬
      OTA_BASE_URL: ${OTA_BASE_URL:-http://localhost:3001}
      OTA_TOKEN: ${OTA_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ Feature Modules (ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â§ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â§ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ = ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂºÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â´ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¥ ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€¦Ã‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ ENABLED_MODULES=inventory,farm) ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬
      ENABLED_MODULES: ${ENABLED_MODULES:-}
      ENERGY_CAPACITY_KWH: ${ENERGY_CAPACITY_KWH:-5}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      THREAT_DETECTION_ENABLED: ${THREAT_DETECTION_ENABLED:-true}
      THREAT_CONNECTION_THRESHOLD: ${THREAT_CONNECTION_THRESHOLD:-100}
      THREAT_ALLOWLIST_IPS: ${THREAT_ALLOWLIST_IPS:-}
      FIREWALL_BLOCK_CMD: ${FIREWALL_BLOCK_CMD:-}
      # ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ Phase 4: Risk & Wealth Infrastructure (opt-in ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂºÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â´ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ infra/.env) ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬
      PORTFOLIO_ENABLED: ${PORTFOLIO_ENABLED:-false}
      PORTFOLIO_FETCH_CRON: ${PORTFOLIO_FETCH_CRON:-0 */4 * * *}
      PORTFOLIO_CASH_USD: ${PORTFOLIO_CASH_USD:-0}
      PORTFOLIO_MONTHLY_EXPENSES_USD: ${PORTFOLIO_MONTHLY_EXPENSES_USD:-0}
      ELECTRICITY_PRICE_USD_PER_KWH: ${ELECTRICITY_PRICE_USD_PER_KWH:-0.12}
      # Transfer Orders — PromptPay QR (เบอร์/เลขบัตรของเจ้าของ → QR สแกนจ่ายได้)
      PROMPTPAY_TARGET: ${PROMPTPAY_TARGET:-}
      PROMPTPAY_NAME: ${PROMPTPAY_NAME:-SOVEREIGN}
      USD_THB_RATE: ${USD_THB_RATE:-35}
      # Dime! Statement — IMAP → PDF → อัปเดตพอร์ต (DIME_ENABLED=true + IMAP ให้ครบ)
      DIME_ENABLED: ${DIME_ENABLED:-false}
      DIME_IMAP_HOST: ${DIME_IMAP_HOST:-}
      DIME_IMAP_PORT: ${DIME_IMAP_PORT:-993}
      DIME_IMAP_USER: ${DIME_IMAP_USER:-}
      DIME_IMAP_PASS: ${DIME_IMAP_PASS:-}
      DIME_IMAP_TLS: ${DIME_IMAP_TLS:-true}
      DIME_IMAP_MAILBOX: ${DIME_IMAP_MAILBOX:-INBOX}
      DIME_LOOKBACK_DAYS: ${DIME_LOOKBACK_DAYS:-45}
      DIME_PDF_PASSWORD: ${DIME_PDF_PASSWORD:-}
      DIME_OWNER_USERNAME: ${DIME_OWNER_USERNAME:-}
      DIME_FETCH_CRON: ${DIME_FETCH_CRON:-0 9 * * *}
      RISK_MONITOR_ENABLED: ${RISK_MONITOR_ENABLED:-false}
      RISK_FEEDS: ${RISK_FEEDS:-}
      RISK_MODEL: ${RISK_MODEL:-gemma3:4b}
      DEFCON_ENABLED: ${DEFCON_ENABLED:-false}
      DEFCON_WAN_DISCONNECT_CMD: ${DEFCON_WAN_DISCONNECT_CMD:-}
      # ---- Next-Gen Security (opt-in - ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ infra/.env) ----
      THREAT_INTEL_FEED_URLS: ${THREAT_INTEL_FEED_URLS:-https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts}
      THREAT_INTEL_MAX_ITEMS: ${THREAT_INTEL_MAX_ITEMS:-5000}
      THREAT_INTEL_FEED_INTERVAL_HOURS: ${THREAT_INTEL_FEED_INTERVAL_HOURS:-24}
      PIHOLE_URL: ${PIHOLE_URL:-}
      PIHOLE_TOKEN: ${PIHOLE_TOKEN:-}
      IDS_EVE_LOG: ${IDS_EVE_LOG:-}
      NTOPNG_URL: ${NTOPNG_URL:-}
      AI_ANALYST_ENABLED: ${AI_ANALYST_ENABLED:-false}
      AI_ANALYST_MODEL: ${AI_ANALYST_MODEL:-gemma3:4b}
      AI_ANALYST_INTERVAL_MIN: ${AI_ANALYST_INTERVAL_MIN:-60}
      AI_ANALYST_TELEGRAM: ${AI_ANALYST_TELEGRAM:-false}
      FIRST_RESPONDER_DURATION_MS: ${FIRST_RESPONDER_DURATION_MS:-7200000}
      LIFESTYLE_ENABLED: ${LIFESTYLE_ENABLED:-true}
      TARGET_EXPOSURE_MIN: ${TARGET_EXPOSURE_MIN:-60}
      EXPOSURE_AQI_CAP: ${EXPOSURE_AQI_CAP:-50}
      HOME_LATITUDE: ${HOME_LATITUDE:-15.0}
      HOME_LONGITUDE: ${HOME_LONGITUDE:-100.0}
      MANUAL_DAY_HOURS: ${MANUAL_DAY_HOURS:-24}
      MESH_ENABLED: "true"
      MESH_OUTPUT_DIR: /app/offsite
      MESH_RSYNC_TARGET: ${MESH_RSYNC_TARGET:-}
      MESH_SCP_TARGET: ${MESH_SCP_TARGET:-}
      OFFSITE_RETAIN: ${OFFSITE_RETAIN:-30}
      UPS_ENABLED: ${UPS_ENABLED:-false}
      UPS_HOST: ${UPS_HOST:-localhost}
      UPS_PORT: ${UPS_PORT:-3493}
      UPS_NAME: ${UPS_NAME:-ups}
      UPS_CHECK_INTERVAL_MS: ${UPS_CHECK_INTERVAL_MS:-30000}
      UPS_LOW_BATTERY_THRESHOLD: ${UPS_LOW_BATTERY_THRESHOLD:-20}
      UPS_SHUTDOWN_BATTERY_PCT: ${UPS_SHUTDOWN_BATTERY_PCT:-15}
      UPS_SHUTDOWN_RUNTIME_SEC: ${UPS_SHUTDOWN_RUNTIME_SEC:-180}
      UPS_SHUTDOWN_CHECK_INTERVAL_MS: ${UPS_SHUTDOWN_CHECK_INTERVAL_MS:-15000}
      UPS_SHUTDOWN_CMD: ${UPS_SHUTDOWN_CMD:-shutdown -h now}
      UPS_DRY_RUN: ${UPS_DRY_RUN:-true}
      # ---- Series 🔴: External Dead-Man Switch (DMS) ----
      DMS_ENABLED: ${DMS_ENABLED:-false}
      DMS_MASTER_SECRET: ${DMS_MASTER_SECRET:-}
      DMS_MISSED_MS: ${DMS_MISSED_MS:-90000}
      DMS_FAILOVER_MS: ${DMS_FAILOVER_MS:-180000}
      DMS_AUTO_FAILOVER: ${DMS_AUTO_FAILOVER:-false}
      DMS_WOL_MAC: ${DMS_WOL_MAC:-}
      DMS_WOL_BROADCAST: ${DMS_WOL_BROADCAST:-192.168.1.255}
      DMS_FAILOVER_COOLDOWN_MS: ${DMS_FAILOVER_COOLDOWN_MS:-300000}
      DMS_ALLOWED_DEVICES: ${DMS_ALLOWED_DEVICES:-dms-esp32s3-01}
      DMS_DRY_RUN: ${DMS_DRY_RUN:-false}
      DMS_CHECK_INTERVAL_MS: ${DMS_CHECK_INTERVAL_MS:-10000}
      DMS_CLOCK_TOLERANCE_MS: ${DMS_CLOCK_TOLERANCE_MS:-60000}
      TELEGRAM_MIN_SEVERITY: ${TELEGRAM_MIN_SEVERITY:-warn}
      TELEGRAM_DEDUP_WINDOW_MS: ${TELEGRAM_DEDUP_WINDOW_MS:-300000}
      TELEGRAM_CRITICAL_RATE_PER_MIN: ${TELEGRAM_CRITICAL_RATE_PER_MIN:-5}
      TELEGRAM_GLOBAL_RATE_PER_MIN: ${TELEGRAM_GLOBAL_RATE_PER_MIN:-60}
      TELEGRAM_DASHBOARD_URL: ${TELEGRAM_DASHBOARD_URL:-}
      DEFCON_DRY_RUN: ${DEFCON_DRY_RUN:-true}
    ports:
      - "3001:3001"
    volumes:
      - ../core-api/src:/app/src          # ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â Backend ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â·ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â­ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ container
