version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: sovereign-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovereign}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  emqx:
    image: emqx/emqx:latest
    container_name: sovereign-emqx
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:?EMQX_PASSWORD is required}
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:18083:18083"
    networks: [internal]

  core-api:
    build:
      context: ../core-api
      dockerfile: Dockerfile.prod
    container_name: sovereign-core-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/${POSTGRES_DB:-sovereign}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${POSTGRES_DB:-sovereign}
      TIMESCALE_USER: ${POSTGRES_USER:-sovereign}
      TIMESCALE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>= 16 random chars)}
      OLLAMA_URL: ${OLLAMA_URL:-http://sovereign-ollama:11434}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      TELEMETRY_FLUSH_MS: ${TELEMETRY_FLUSH_MS:-60000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OTA_BASE_URL: ${OTA_BASE_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DEFCON_ENABLED: ${DEFCON_ENABLED:-true}
      DEFCON_DRY_RUN: ${DEFCON_DRY_RUN:-true}
      MESH_ENABLED: ${MESH_ENABLED:-true}
      MESH_OUTPUT_DIR: ${MESH_OUTPUT_DIR:-/app/offsite}
      MESH_PUSH_URL: ${MESH_PUSH_URL:-}
      MESH_PUSH_TOKEN: ${MESH_PUSH_TOKEN:-}
      UPS_ENABLED: ${UPS_ENABLED:-false}
      UPS_HOST: ${UPS_HOST:-localhost}
      UPS_PORT: ${UPS_PORT:-3493}
      UPS_NAME: ${UPS_NAME:-ups}
      UPS_SHUTDOWN_BATTERY_PCT: ${UPS_SHUTDOWN_BATTERY_PCT:-15}
      UPS_SHUTDOWN_RUNTIME_SEC: ${UPS_SHUTDOWN_RUNTIME_SEC:-180}
      UPS_SHUTDOWN_CHECK_INTERVAL_MS: ${UPS_SHUTDOWN_CHECK_INTERVAL_MS:-15000}
      UPS_SHUTDOWN_CMD: ${UPS_SHUTDOWN_CMD:-shutdown -h now}
      UPS_DRY_RUN: ${UPS_DRY_RUN:-true}
      DMS_ENABLED: ${DMS_ENABLED:-false}
      DMS_MASTER_SECRET: ${DMS_MASTER_SECRET:-}
      DMS_MISSED_MS: ${DMS_MISSED_MS:-90000}
      DMS_FAILOVER_MS: ${DMS_FAILOVER_MS:-180000}
      DMS_AUTO_FAILOVER: ${DMS_AUTO_FAILOVER:-false}
      DMS_WOL_MAC: ${DMS_WOL_MAC:-}
      DMS_WOL_BROADCAST: ${DMS_WOL_BROADCAST:-192.168.1.255}
      DMS_FAILOVER_COOLDOWN_MS: ${DMS_FAILOVER_COOLDOWN_MS:-300000}
      DMS_ALLOWED_DEVICES: ${DMS_ALLOWED_DEVICES:-dms-esp32s3-01}
      DMS_DRY_RUN: ${DMS_DRY_RUN:-false}
      DMS_CHECK_INTERVAL_MS: ${DMS_CHECK_INTERVAL_MS:-10000}
      DMS_CLOCK_TOLERANCE_MS: ${DMS_CLOCK_TOLERANCE_MS:-60000}
      TELEGRAM_MIN_SEVERITY: ${TELEGRAM_MIN_SEVERITY:-warn}
      TELEGRAM_DEDUP_WINDOW_MS: ${TELEGRAM_DEDUP_WINDOW_MS:-300000}
      TELEGRAM_CRITICAL_RATE_PER_MIN: ${TELEGRAM_CRITICAL_RATE_PER_MIN:-5}
      TELEGRAM_GLOBAL_RATE_PER_MIN: ${TELEGRAM_GLOBAL_RATE_PER_MIN:-60}
      TELEGRAM_DASHBOARD_URL: ${TELEGRAM_DASHBOARD_URL:-}
      # HTTPS (optional) ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â mount certs ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â²ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â®ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚ÂªÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã¢â‚¬Â¦ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    ports:
      - "${CORE_API_PORT:-3001}:3001"
    volumes:
      - ./backups:/app/backups
      - ./data:/app/data
      - ./knowledge:/app/knowledge
      - ./ota_firmwares:/app/ota_firmwares
      - ./.env:/app/host-infra.env:ro
      - ../infra/offsite:/app/offsite
      # ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚ÂºÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â´ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â mount certs ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã…â€œÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â°ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â²ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â°ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã¢â‚¬Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¸ÃƒÆ’Ã¢â‚¬Â¦Ãƒâ€šÃ‚Â ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â° HTTPS:
      # - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_started
    networks: [internal]

  frontend:
    build:
      context: ../../sovereign-frontend
      dockerfile: Dockerfile.prod
    container_name: sovereign-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      core-api:
        condition: service_healthy
    networks: [internal]

  # ── AI Engine (optional — เปิดด้วย: docker compose --profile ai up -d) ──
  # โมเดลเก็บใน volume ของเรา — offline 100% ไม่ส่งข้อมูลออก
  # เปิด: docker compose --profile ai up -d ollama
  # ปิด: docker compose stop ollama
  # โหลดโมเดลครั้งแรก: docker exec sovereign-ollama ollama pull gemma3:4b
  ollama:
    image: ollama/ollama:latest
    container_name: sovereign-ollama
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    networks: [internal]

volumes:
  pgdata:
  ollama_models:

networks:
  internal:
    driver: bridge
