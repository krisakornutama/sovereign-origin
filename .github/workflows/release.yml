name: Release Desktop

# ปล่อยชุดติดตั้ง Sovereign OS สำหรับ Windows อัตโนมัติ
# - trigger: push tag v* (เช่น v1.2.1) — tag ต้องตรงกับ version ใน sovereign-frontend/package.json
# - build บน windows-latest เพราะ electron-builder target "portable" ต้องใช้ NSIS/wine ฝั่ง Windows
# - ลำดับ: ตรวจ tag → build core-api (sidecar) → build static export → electron-builder (portable exe + zip)
#          → stage + SHA256SUMS.txt → ตรวจซ้ำ → แนบ GitHub Release
# - ไม่มี signing certificate: ปิด auto-discovery (แอป updater ตรวจ SHA-256 ของไฟล์แทน)
#
# หมายเหตุ: workflow นี้ไม่รัน `npm run verify` (E2E ต้องมี backend+DB)
#   ด่านคุณภาพยังอยู่ที่ PR/CI ปกติ — ที่นี่เน้น "แพ็กของที่ build ได้จริงแล้วปล่อย"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag ที่ต้องการปล่อย (ต้องมีอยู่แล้ว เช่น v1.2.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + publish Windows desktop
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sovereign-frontend/package-lock.json
            sovereign-os/core-api/package-lock.json

      # ดักตั้งแต่ต้น: tag v1.2.1 แต่ package.json ยังเป็น 1.2.0 = หยุดก่อนเสียเวลา build
      - name: ตรวจ tag ↔ version
        shell: bash
        run: node tools/release-build.mjs --check-tag="${{ inputs.tag || github.ref_name }}"

      - name: ติดตั้ง dependencies + build core-api (sidecar)
        working-directory: sovereign-os/core-api
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: ติดตั้ง dependencies ของ frontend
        working-directory: sovereign-frontend
        run: npm ci

      - name: Build static export
        working-directory: sovereign-frontend
        run: npm run build:static

      - name: Build portable exe + zip
        working-directory: sovereign-frontend
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # คัดเฉพาะ artifact ของ version นี้ + เขียน SHA256SUMS.txt ลง staging dir
      - name: Stage artifacts + SHA256SUMS
        run: node tools/release-build.mjs --stage --dir=sovereign-frontend/dist-electron --out=release-assets

      # ตรวจซ้ำก่อนปล่อย: ไฟล์ที่อัปโหลดต้องตรงกับ manifest ทุกไบต์
      - name: Verify checksums
        run: node tools/release-build.mjs --verify --dir=release-assets

      # ยืนยันชัด ๆ ว่า SHA256SUMS.txt อยู่ในชุดที่จะแนบ (ไม่พึ่ง glob เงียบ ๆ)
      - name: ยืนยัน SHA256SUMS.txt
        shell: bash
        run: |
          test -f release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      # ── Provenance: เซ็น artifact ด้วยกุญแจที่อยู่ใน sovereign-vault ──
      # ปิดไว้โดยปริยาย: ต้องตั้ง repo variable ATTEST_ENABLED=true และ secret
      # ATTEST_MASTER_KEY (base64 32 ไบต์) ก่อน — ไม่มีกุญแจก็ไม่ควรมีใบรับรองปลอม
      - name: Build sovereign-attest + vault (siblings)
        if: ${{ vars.ATTEST_ENABLED == 'true' }}
        shell: bash
        run: |
          git clone --depth 1 https://github.com/krisakornutama/sovereign-vault.git ../sovereign-vault
          git clone --depth 1 https://github.com/krisakornutama/sovereign-attest.git ../sovereign-attest
          (cd ../sovereign-vault && npm ci && npm run build)
          (cd ../sovereign-attest && npm ci && npm run build)

      - name: ดึง attestation ของรุ่นก่อน (ถ้ามี) เพื่อต่อ chain
        if: ${{ vars.ATTEST_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev="$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)"
          if [ -n "$prev" ]; then
            gh release download "$prev" -p sovereign-attest.json -D .attest-prev || true
          fi
          ls -la .attest-prev 2>/dev/null || echo "ไม่มี attestation ของรุ่นก่อน — เริ่ม chain ใหม่"

      - name: เซ็น release ด้วย sovereign-attest
        if: ${{ vars.ATTEST_ENABLED == 'true' }}
        shell: bash
        env:
          ATTEST_MASTER_KEY: ${{ secrets.ATTEST_MASTER_KEY }}
        run: |
          prev_arg=""
          [ -f .attest-prev/sovereign-attest.json ] && prev_arg="--previous=.attest-prev/sovereign-attest.json"
          node tools/attest-release.mjs --sign --dir=release-assets --tag="${{ inputs.tag || github.ref_name }}" $prev_arg
          node tools/attest-release.mjs --verify release-assets/sovereign-attest.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sovereign-os-${{ inputs.tag || github.ref_name }}-win-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Sovereign OS ${{ inputs.tag || github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
