name: Architecture Gate

# ด่านแรกของ repo — ทำงานทุก PR ก่อน merge เสมอ (ตาม AGENTS.md ข้อ 2)
# ตรวจ: file-budget (เทียบ base branch) · boundary-baseline (เส้นข้ามใหม่ = fail)
#       frontend-gate (import-layers · line-budget · sidebar-rule) — ของใหม่ที่ละเมิด = fail
#       + fingerprint parity (อัลกอริทึม tools ↔ runtime ต้องตรงกันทุกไบต์)
# หมายเหตุ: env-truth ข้ามบน CI โดยธรรมชาติ (ไม่มี .env) — arch-gate จัดการ "ไม่มี .env = ข้าม" ให้แล้ว

on:
  # ไม่ใส่ paths filter ตอน PR โดยเจตนา: context นี้เป็น required check — ถ้ากรอง paths
  # เช็คจะ "หาย" บน PR ที่ไม่แตะไฟล์ที่กรอง แล้ว merge ไม่ได้เลย
  pull_request:
  push:
    branches: [main]
    paths:
      - 'sovereign-os/core-api/**'
      - 'sovereign-frontend/**'
      - 'tools/**'
      - '.github/workflows/arch-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # file-budget ต้อง diff กับ base branch ได้

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: ตรวจ file-budget + boundary-baseline
        run: node tools/arch-gate.mjs --base origin/${{ github.base_ref || 'main' }}

      - name: ตรวจ frontend-gate (import-layers + line-budget + sidebar-rule)
        run: node tools/frontend-gate.mjs --base origin/${{ github.base_ref || 'main' }}

      # เดิม CI ไม่ได้ติดตั้ง deps → tsc ใช้ global แล้วฟ้อง Cannot find name 'process'/'console'
      # และ Cannot find module 'dotenv' ทั้งไฟล์ (Build core-api แดงทุกครั้งที่แตะ tools/**)
      - name: ติดตั้ง dependencies ของ core-api
        run: npm ci
        working-directory: sovereign-os/core-api

      - name: สร้าง Prisma client (tsc ต้องใช้ type ที่ generate)
        run: npx prisma generate
        working-directory: sovereign-os/core-api

      - name: Build core-api (เพื่อตรวจ fingerprint parity)
        run: npm run build
        working-directory: sovereign-os/core-api

      - name: ตรวจ fingerprint parity (tools ↔ runtime)
        run: node tools/check-parity.mjs

      # tools suite เต็มชุด (1349 เทสต์) — เดิมค้างบน runner เพราะเทสต์หนึ่งปิด HTTP server
      # ทั้งที่ยังมี keep-alive socket (Node ≥19) → ปิด socket ก่อน close + `--test-force-exit`
      # ในสคริปต์ test:tools แล้ว ชุดจึงจบใน ~30 วิ (ทั้งเครื่องและ CI) · ต้องมี deps ของ core-api
      # (step ด้านบนลงให้แล้ว) เพราะ backend-conflict-resolver เรียก tsx จาก node_modules
      - name: ตรวจ tools suite เต็มชุด (test:tools)
        run: npm run test:tools
        timeout-minutes: 10
