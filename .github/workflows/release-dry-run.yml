name: Release dry-run

# ซ้อมเส้นทาง provenance ของ release โดยไม่ปล่อยอะไรจริง
#
# ทำไมเป็นไฟล์แยก: `release.yml` เรียกด้วย workflow_dispatch ไม่ได้มาตั้งแต่ก่อนงานนี้
# (run ขึ้น startup_failure ก่อนมี job — แม้แต่เวอร์ชันก่อนเพิ่มขั้น attest) การซ้อมจึงอยู่ที่นี่
# เพื่อให้กด Run workflow ได้จริง และยังผูกกับ PR ที่แตะเครื่องมือ/ขั้นตอนพวกนี้ด้วย
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'

permissions:
  contents: read

jobs:
  dry-run:
    name: dry-run provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Build sovereign-attest + vault (siblings) สำหรับเส้นทางเซ็นจริง
        shell: bash
        run: |
          git clone --depth 1 https://github.com/krisakornutama/sovereign-vault.git ../sovereign-vault
          git clone --depth 1 https://github.com/krisakornutama/sovereign-attest.git ../sovereign-attest
          (cd ../sovereign-vault && npm ci && npm run build)
          (cd ../sovereign-attest && npm ci && npm run build)

      - name: ซ้อมเซ็น → ตรวจ → ประกาศ fingerprint (กุญแจชั่วคราว ไม่ใช้ secret)
        shell: bash
        run: node tools/release-dry-run.mjs
