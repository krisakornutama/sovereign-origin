name: Core API tests

on:
  push:
    branches: [main]
    paths:
      - 'sovereign-os/core-api/**'
      - 'tools/test/**'
      - '.github/workflows/core-api-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # เมทริกซ์แพลตฟอร์ม — mock suite ครบทุก OS (service containers ใช้ได้บน Linux เท่านั้น จึงแยก test-db ออก)
  test:
    strategy:
      fail-fast: false
      matrix:
        # พฤติกรรม path ของ harden-upload ต้องเหมือนกันทั้ง POSIX/Windows
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sovereign-os/core-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # type-stripping — ทดสอบ import .ts ตรง ๆ แบบเดียวกับเครื่อง dev

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests (mock suite)
        run: npm test
        env:
          JWT_SECRET: ci-secret-0123456789abcdef
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          # service บางตัวใช้เวลาท้องถิ่น (getHours) — จัดเขตเวลาให้ CI ตรงเซิร์ฟเวอร์โปรดักชัน (กรุงเทพ)
          TZ: Asia/Bangkok

  # real-Postgres — lifecycle จริงของจุดรับไฟล์ multer: knowledge upload (upload→DB row→serve→DELETE
  #   ลบทั้ง DB และดิสก์) + documents scan-to-inventory (multipart→AI mock→inventory_items) + treasury slip
  #   (evidence_url data URL ใน DB + ปฏิเสธเกิน 2MB + คำสั่ง VERIFIED อัปโหลดซ้ำไม่ได้)
  test-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign-os/core-api
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to CI Postgres
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Run real-DB lifecycle tests
        run: npx tsx --test --test-concurrency=1 tests/knowledge-db.test.ts tests/uploads-db.test.ts tests/vision-detections-db.test.ts tests/security-events-db.test.ts tests/dime-db.test.ts tests/password-lifecycle-db.test.ts
        env:
          JWT_SECRET: ci-secret-0123456789abcdef
          RUN_DB_TESTS: '1'
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          TEST_TMPDIR: ${{ github.workspace }}/.dbtest-tmp
