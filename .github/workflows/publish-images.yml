name: Publish images (GHCR)

# เผยแพร่ image ของ Community Edition ขึ้น GitHub Container Registry
# - trigger: push tag v* (เช่น v1.2.0) หรือกด Run workflow เอง
# - build แยก job ต่อ platform และรันบน runner สถาปัตยกรรมตรงกัน (ไม่ใช้ QEMU เลย)
#   amd64 → ubuntu-latest, arm64 → ubuntu-24.04-arm (ฟรีสำหรับ public repo)
#   ทั้งสองวิ่งพร้อมกัน แล้ว merge เป็น multi-arch manifest ใน job `merge`
#   → amd64 พร้อมใช้ในไม่กี่นาที และ arm64 ไม่ค้าง QEMU อีก
#   (เดิมใช้ QEMU emulate arm64: job `api` ค้างถึง 6 ชม. แล้วถูก GitHub ตัดทิ้ง)
# - cache แยก scope ต่อ image+arch เพื่อไม่ให้ cache ของ arm64 ไปทับของ amd64
#
# หลัง publish ครั้งแรก: package จะเป็น private แม้ repo จะ public
#   → Packages → เลือก package → Package settings → Change visibility → Public
#   (ทำครั้งเดียวต่อ package: api และ web)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'ติด tag เพิ่มให้ image (เช่น 1.2.0) — ใช้เติม tag ที่ขาดโดยไม่ต้องสร้าง git tag ใหม่'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # เผื่อไว้พอสมควร: build ปกติจบใน ~10 นาที ถ้าค้างเกินนี้คือมีปัญหา ไม่ต้องรอ 6 ชม.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            context: ./sovereign-os/core-api
            file: ./sovereign-os/core-api/Dockerfile.prod
          - name: api
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            context: ./sovereign-os/core-api
            file: ./sovereign-os/core-api/Dockerfile.prod
          - name: web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            context: ./sovereign-frontend
            file: ./sovereign-frontend/Dockerfile.prod
          - name: web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            context: ./sovereign-frontend
            file: ./sovereign-frontend/Dockerfile.prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ไม่มีขั้น QEMU: runner arm64 เป็น ARM จริง build จึงเร็วเท่า amd64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          # ยังไม่ติด tag ในขั้นนี้ — merge job จะติด tag บน manifest รวมให้
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # web ฝัง NEXT_PUBLIC_API_URL ตอน build — ตั้ง repo variable เพื่อเปลี่ยนค่าเริ่มต้น
          build-args: ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001') || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::ไม่มี digest จากขั้น build"
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.name }} (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        name: [api, web]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          echo "digests ที่ได้รับ:"
          ls -1
          image="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect manifest
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}"
          docker buildx imagetools inspect "$image:${GITHUB_REF_NAME#v}" || docker buildx imagetools inspect "$image:latest"
