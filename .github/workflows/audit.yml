name: Audit site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Copy gate (Thai spelling/markup, no browser needed)
        run: node scripts/check-copy.mjs --self-test && node scripts/check-copy.mjs

      - name: Install audit tooling
        run: npm install --no-fund --no-audit

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Audit (links, anchors, console, overflow, widgets)
        run: node scripts/audit.js
